<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OW2 Tier Maker</title>
    <link rel="stylesheet" href="css/tiermaker-entry.css">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body class="tiermaker-page">
    <nav class="tier-tab-menu" aria-label="영웅 역할 선택">
        <button class="tier-tab-button is-active active" type="button" data-role="tank">🛡️ TANK</button>
        <button class="tier-tab-button" type="button" data-role="damage">⚔️ DPS</button>
        <button class="tier-tab-button" type="button" data-role="support">💉 SUP</button>
    </nav>

    <main class="tier-capture-wrap" id="capture-area">
        <section id="board-tank" class="tier-board-container is-active active" data-role="tank">
            <h1 class="tier-header">돌격 영웅 티어리스트</h1>
            <div class="tier-box"></div>
        </section>

        <section id="board-damage" class="tier-board-container" data-role="damage">
            <h1 class="tier-header">공격 영웅 티어리스트</h1>
            <div class="tier-box"></div>
        </section>

        <section id="board-support" class="tier-board-container" data-role="support">
            <h1 class="tier-header">지원 영웅 티어리스트</h1>
            <div class="tier-box"></div>
        </section>
    </main>

    <div class="controls">
        <button id="btn-add-tier" class="btn btn-secondary" type="button">+ 티어 추가</button>
        <button id="btn-save-image" class="btn btn-primary" type="button">이미지 저장</button>
    </div>

    <section class="roster-container" aria-label="영웅 목록">
        <div class="roster-section">
            <h2 class="roster-head"><span class="icon-role">🛡️</span> 돌격 (Tank)</h2>
            <div id="roster-tank" class="tier-dropzone dropzone" style="background: rgba(255,255,255,0.02);"></div>
        </div>

        <div class="roster-section">
            <h2 class="roster-head"><span class="icon-role">⚔️</span> 공격 (Damage)</h2>
            <div id="roster-damage" class="tier-dropzone dropzone" style="background: rgba(255,255,255,0.02);"></div>
        </div>

        <div class="roster-section">
            <h2 class="roster-head"><span class="icon-role">💉</span> 지원 (Support)</h2>
            <div id="roster-support" class="tier-dropzone dropzone" style="background: rgba(255,255,255,0.02);"></div>
        </div>
    </section>

    <script type="module" src="js/tiermaker.js"></script>
</body>
</html>
