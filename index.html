<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오버워치 허브 - 파티찾기 / 그룹찾기</title>
    <meta name="google-site-verification" content="7OvWXc4oEGF5-Aub2pEWiCaBatEsSzA4Im454PrJ0kM">
    <meta name="theme-color" content="#ff9c00">
    <meta name="keywords" content="오버워치 파티찾기, 오버워치2 그룹찾기, 오버워치 커뮤니티, 오버워치 듀오, 오버워치 티어별 매칭, 티어메이커, owhub">
    <meta name="description" content="오버워치2 팀원을 빠르게 찾는 파티 매칭 서비스입니다. 포지션과 티어별로 그룹을 찾고 커뮤니티를 이용해보세요.">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="Overwatch Hub - 파티 매칭 서비스">
    <meta property="og:description" content="지금 바로 실력에 맞는 팀원을 찾아보세요.">
    <meta property="og:url" content="https://owhub.vercel.app">
    <meta property="og:image" content="https://owhub.vercel.app/og.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="1200">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <h1 class="sr-only">오버워치 허브 - 실시간 그룹찾기 / 파티 매칭</h1>

    <nav class="app-nav">
        <button id="hamburger-btn" class="sidebar-toggle" type="button" aria-label="메뉴 열기">
            ☰
            <span id="nav-new-badge" style="display:none; position:absolute; top:3px; right:3px; width:10px; height:10px; background:#ff3c3c; border-radius:50%; border:2px solid #000;"></span>
        </button>

        <a class="nav-logo" href="index.html" aria-label="OW Hub 홈">
            <img src="img/logo.jpg" alt="OW HUB">
        </a>

        <div style="width:36px;"></div>
    </nav>

    <div class="live-status-bar">
        <span>OVERWATCH HUB</span>
        <span id="profile-summary">로그인 필요</span>
    </div>

    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    <aside id="sidebar" class="sidebar-panel" aria-label="사이드 메뉴">
        <div class="sidebar-menu">
            <button class="sidebar-menu-item is-active active" type="button" data-page-target="list" data-page="list">파티찾기</button>
            <button class="sidebar-menu-item" type="button" data-page-target="profile" data-page="profile">내 정보</button>
            <button class="sidebar-menu-item" type="button" data-page-target="notifications" data-page="notifications">
                <span>알림</span>
                <span class="menu-new" id="side-new-badge" style="display:none;">NEW</span>
            </button>
            <a class="sidebar-menu-item" href="commu.html">커뮤니티</a>
            <a class="sidebar-menu-item" href="tiermaker.html">티어메이커</a>
        </div>

        <div class="sidebar-auth" id="auth-panel"></div>
    </aside>

    <main class="container">
        <section class="page is-active active" data-page="list" id="page-list">
            <section class="card card-highlight">
                <h2 style="margin-top:0; color:var(--color-accent);">파티 모집</h2>
                <div id="party-form" class="party-form-grid"></div>
            </section>

            <section class="party-filter-panel">
                <div id="search-title-area" class="party-filter-title">
                    <strong>검색 필터</strong>
                </div>

                <div class="filter-section">
                    <p class="form-label">포지션</p>
                    <div id="role-filter"></div>
                </div>

                <div class="filter-divider"></div>

                <div class="filter-section">
                    <p class="form-label">티어</p>
                    <div id="tier-filter"></div>
                </div>

                <button class="btn btn-secondary btn-block" id="btn-filter-reset" type="button">필터 초기화</button>
            </section>

            <section>
                <h2 style="color:var(--color-accent);">실시간 파티 목록</h2>
                <div id="party-list" class="party-list" aria-live="polite"></div>
            </section>
        </section>

        <section class="page" data-page="profile" id="page-profile">
            <section class="card">
                <h2 style="margin-top:0; color:var(--color-accent);">내 정보</h2>
                <div id="profile-form"></div>
            </section>
        </section>

        <section class="page" data-page="notifications" id="page-notifications">
            <section class="card">
                <h2 style="margin-top:0; color:var(--color-accent);">알림</h2>
                <div id="notification-list"></div>
            </section>
        </section>
    </main>

    <script type="module" src="js/index.js"></script>
</body>
</html>
