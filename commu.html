<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오버워치 허브 커뮤니티</title>
    <link rel="stylesheet" href="css/commu.css">
</head>
<body>
    <nav class="app-nav">
        <div class="nav-left">
            <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-label="마이페이지 열기">☰</button>
            <div class="nav-tabs">
                <a class="nav-tab" href="index.html">파티찾기</a>
                <span class="nav-tab is-active">커뮤니티</span>
            </div>
        </div>
        <div id="auth-ui"></div>
    </nav>

    <aside id="sidebar" class="sidebar-panel" aria-label="마이페이지">
        <div class="card" style="margin:0; border-radius:0; border-width:0 0 1px 0;">
            <h3 style="color:var(--color-accent); margin-top:0;">MY PAGE</h3>
            <h2 id="my-btag-display" style="font-size:16px; margin-bottom:12px;">-</h2>
            <div id="sidebar-logout-container"></div>
        </div>

        <div class="sidebar-menu">
            <button id="my-posts-toggle" class="sidebar-menu-item" type="button" style="width:calc(100% - 24px); border:0; text-align:left;">
                <span>📝 내가 쓴 게시글</span>
                <span id="my-posts-arrow" style="font-size:10px;">▶</span>
            </button>
            <div id="my-posts-list" class="my-posts-list" hidden></div>
        </div>
    </aside>
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <main class="container">
        <section class="community-write-panel">
            <h4 style="color:var(--color-accent); margin:0 0 10px 0;">💬 자유게시판</h4>
            <label class="sr-only" for="comm-title">제목</label>
            <input class="form-input" type="text" id="comm-title" placeholder="제목" maxlength="80">
            <label class="sr-only" for="comm-content">내용</label>
            <textarea class="form-textarea" id="comm-content" placeholder="오버워치 이야기를 나누어보세요!" rows="4" maxlength="2000"></textarea>
            <button class="btn btn-primary btn-block" id="btn-comm-post" type="button">글 등록하기</button>
        </section>

        <section id="comm-list" class="community-list" aria-live="polite"></section>
    </main>

    <script type="module" src="js/commu.js"></script>
</body>
</html>
