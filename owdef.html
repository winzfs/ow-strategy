<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>운빨디펜스: 이터널</title>
    <style>
        :root { --p: #00f2ff; --s: #7000ff; --d: #ff0055; --bg: #050505; }
        
        /* 1. 브라우저 기본 동작 완전히 봉쇄 */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none; margin: 0; padding: 0; }
        
        body, html { 
            width: 100%; height: 100%; 
            background: #000; /* 배경을 검정색으로 고정 */
            overflow: hidden; position: fixed; 
        }

        /* 2. 게임 메인 컨테이너 - 화면 중앙 강제 배치 */
        #app {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100vw; height: 100vh;
            display: flex; flex-direction: column;
            background: var(--bg);
            overflow: hidden;
        }

        canvas { 
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%; 
            z-index: 1; /* 최하단 */
        }

        /* 3. UI 레이어 - 유연한 배치 */
        .ui { position: relative; z-index: 10; width: 100%; pointer-events: none; }
        
        #top-bar { 
            padding-top: env(safe-area-inset-top, 20px);
            display: flex; justify-content: center; gap: 8px;
        }
        
        #bottom-bar { 
            margin-top: auto; 
            padding-bottom: calc(env(safe-area-inset-bottom, 20px) + 20px);
            display: flex; justify-content: center;
        }

        .box { background: rgba(20, 20, 20, 0.95); padding: 6px 12px; border-radius: 12px; border: 1px solid rgba(0,242,255,0.2); text-align: center; min-width: 80px; }
        .label { font-size: 10px; color: #888; display: block; text-transform: uppercase; }
        .val { font-size: 16px; font-weight: bold; color: #fff; }

        .btn-spawn { 
            width: 85%; height: 60px; pointer-events: auto;
            background: linear-gradient(135deg, var(--s), var(--p));
            border: none; color: white; border-radius: 18px; font-size: 20px; font-weight: bold;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
        }

        /* 4. 화면 덮개 (로비/게임오버) */
        .overlay { 
            position: absolute; inset: 0; z-index: 100; 
            background: var(--bg); display: flex; flex-direction: column; 
            justify-content: center; align-items: center; padding: 20px;
        }
        .hidden { display: none !important; }
        
        h1 { color: var(--p); font-size: 42px; text-align: center; margin-bottom: 20px; text-shadow: 0 0 15px var(--p); line-height: 0.9; }
        .up-card { width: 100%; max-width: 300px; display: flex; justify-content: space-between; align-items: center; background: #111; padding: 15px; border-radius: 15px; margin-bottom: 10px; border: 1px solid #222; }
        .btn-play { padding: 18px 60px; background: linear-gradient(135deg, var(--s), var(--p)); border: none; color: white; border-radius: 20px; font-size: 22px; font-weight: bold; }
        .btn-up { padding: 10px 15px; background: #222; border: 1px solid #444; border-radius: 10px; color: #fff; font-size: 12px; }
    </style>
</head>
<body>

    <div id="app">
        <canvas id="gameCanvas"></canvas>

        <div id="top-bar" class="ui hidden">
            <div class="box"><span class="label">Gold</span><span id="gold-val" class="val">100</span></div>
            <div class="box"><span class="label">Life</span><span id="life-val" class="val" style="color:var(--d)">30</span></div>
            <div class="box"><span class="label">Wave</span><span id="wave-val" class="val">1</span></div>
        </div>

        <div style="flex:1;"></div>

        <div id="bottom-bar" class="ui hidden">
            <button class="btn-spawn" id="spawn-btn">유닛 소환 (10G)</button>
        </div>

        <div id="lobby-screen" class="overlay">
            <h1>LUCKY<br>ETERNAL</h1>
            <div style="color:#888; margin-bottom:20px;">영혼석: <span id="soul-val" style="color:var(--p)">0</span></div>
            <div style="width:100%; max-width:300px;">
                <div class="up-card">
                    <div><div style="color:#eee; font-weight:bold;">공격력 강화</div><div style="color:var(--p); font-size:12px;">Lv.<span id="atk-lv">1</span></div></div>
                    <button class="btn-up" id="up-atk-btn">강화 (10)</button>
                </div>
                <div class="up-card">
                    <div><div style="color:#eee; font-weight:bold;">초기 골드</div><div style="color:var(--p); font-size:12px;">Lv.<span id="gold-lv">1</span></div></div>
                    <button class="btn-up" id="up-gold-btn">강화 (15)</button>
                </div>
            </div>
            <br>
            <button class="btn-play" id="start-btn">전투 시작</button>
        </div>

        <div id="over-screen" class="overlay hidden">
            <h1 style="color:var(--d)">GAME OVER</h1>
            <div id="result-text" style="color:#aaa; margin-bottom:30px; text-align: center; line-height: 1.5;"></div>
            <button class="btn-play" id="restart-btn">로비로 이동</button>
        </div>
    </div>

<script>
/** * [시스템] 초기화 및 리사이징 (잘림 방지)
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const app = document.getElementById('app');

let soulStones = parseInt(localStorage.getItem('soulStones')) || 0;
let upgradeAtkLv = parseInt(localStorage.getItem('atkLv')) || 1;
let upgradeGoldLv = parseInt(localStorage.getItem('goldLv')) || 1;

let gold, wave, life, monsters, board, lastTime, spawnTimer, dragIdx, mx, my;
let gameState = 'LOBBY';

const GRADES = [
    { c: 'rgba(255,255,255,0.1)', s: '#ffffff', p: 15 },
    { c: 'rgba(0,242,255,0.15)', s: '#00f2ff', p: 40 },
    { c: 'rgba(112,0,255,0.2)', s: '#7000ff', p: 90 },
    { c: 'rgba(255,0,85,0.25)', s: '#ff0055', p: 250 }
];

let TILE_SIZE, BOARD_X, BOARD_Y, PATH;

function initLayout() {
    // 실제 브라우저 가시 영역 계산
    const w = window.innerWidth;
    const h = window.innerHeight;
    canvas.width = w;
    canvas.height = h;
    app.style.width = w + "px";
    app.style.height = h + "px";

    // 보드 크기 결정 (화면 세로 비율에 민감하게 반응)
    TILE_SIZE = Math.min(w / 4.5, h / 9); 
    BOARD_X = (w - (TILE_SIZE * 4)) / 2;
    BOARD_Y = (h - (TILE_SIZE * 4)) / 2;

    const off = TILE_SIZE * 0.5;
    const pT = BOARD_Y - off, pB = BOARD_Y + (TILE_SIZE * 4) + off;
    const pL = BOARD_X - off, pR = BOARD_X + (TILE_SIZE * 4) + off;
    PATH = [{x1:pL,y1:pT,x2:pR,y2:pT},{x1:pR,y1:pT,x2:pR,y2:pB},{x1:pR,y1:pB,x2:pL,y2:pB},{x1:pL,y1:pB,x2:pL,y2:pT}];
}

/**
 * [게임 엔진] 유닛, 공격, 몬스터
 */
function spawnUnit() {
    if (gameState !== 'PLAY' || gold < 10) return;
    const empty = board.map((v, i) => v === null ? i : null).filter(v => v !== null);
    if (empty.length > 0) {
        gold -= 10;
        board[empty[Math.floor(Math.random() * empty.length)]] = { grade: 0, timer: 0 };
    }
}

function drawUnit(u, x, y) {
    const g = GRADES[u.grade];
    const s = TILE_SIZE * 0.75;
    ctx.fillStyle = g.c;
    ctx.beginPath();
    ctx.ellipse(x, y + s/3, s/1.6, s/12, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = g.s;
    ctx.beginPath(); ctx.arc(x, y, s/3.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#000'; ctx.font = `bold ${TILE_SIZE*0.18}px sans-serif`;
    ctx.fillText(u.grade + 1, x, y + TILE_SIZE*0.06);
}

function gameLoop(time) {
    if (gameState !== 'PLAY') return;
    const dt = time - lastTime; lastTime = time;
    ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 몬스터 생성 및 이동
    spawnTimer += dt;
    if (spawnTimer > Math.max(400, 2000 - (wave * 100))) {
        monsters.push({ x: PATH[0].x1, y: PATH[0].y1, pathIdx: 0, hp: 70 * Math.pow(1.2, wave), maxHp: 70 * Math.pow(1.2, wave), speed: 1.6 + (wave * 0.05) });
        spawnTimer = 0;
    }
    for (let i = monsters.length - 1; i >= 0; i--) {
        const m = monsters[i], p = PATH[m.pathIdx];
        const dx = p.x2 - p.x1, dy = p.y2 - p.y1, len = Math.sqrt(dx*dx + dy*dy);
        m.x += (dx/len) * m.speed; m.y += (dy/len) * m.speed;
        if (Math.hypot(m.x - p.x2, m.y - p.y2) < 5) {
            m.pathIdx++;
            if (m.pathIdx >= PATH.length) { life--; monsters.splice(i, 1); continue; }
            m.x = PATH[m.pathIdx].x1; m.y = PATH[m.pathIdx].y1;
        }
        ctx.fillStyle = '#ff0055'; ctx.beginPath(); ctx.arc(m.x, m.y, TILE_SIZE*0.12, 0, Math.PI*2); ctx.fill();
    }

    // 타일 및 유닛 전투
    ctx.textAlign = 'center';
    for (let i = 0; i < 16; i++) {
        const bx = BOARD_X + (i % 4) * TILE_SIZE, by = BOARD_Y + Math.floor(i / 4) * TILE_SIZE;
        ctx.strokeStyle = '#1a1a1a'; ctx.strokeRect(bx+2, by+2, TILE_SIZE-4, TILE_SIZE-4);
        if (board[i] && dragIdx !== i) {
            const ux = bx + TILE_SIZE/2, uy = by + TILE_SIZE/2;
            drawUnit(board[i], ux, uy);
            board[i].timer += dt;
            if (board[i].timer > (1000 - board[i].grade*150) && monsters.length > 0) {
                let target = monsters.find(m => Math.hypot(m.x - ux, m.y - uy) < TILE_SIZE * 3);
                if (target) {
                    board[i].timer = 0;
                    ctx.strokeStyle = GRADES[board[i].grade].s; ctx.lineWidth = 2;
                    ctx.beginPath(); ctx.moveTo(ux, uy); ctx.lineTo(target.x, target.y); ctx.stroke();
                    target.hp -= GRADES[board[i].grade].p * (1 + (upgradeAtkLv-1)*0.08);
                    if (target.hp <= 0) { gold += 3; monsters.splice(monsters.indexOf(target), 1); }
                }
            }
        }
    }
    if (dragIdx !== null) drawUnit(board[dragIdx], mx, my);

    document.getElementById('gold-val').innerText = Math.floor(gold);
    document.getElementById('life-val').innerText = life;
    document.getElementById('wave-val').innerText = wave;
    if (time % 15000 < 20) wave++;
    if (life <= 0) endGame(); else requestAnimationFrame(gameLoop);
}

/**
 * [컨트롤] 게임 시작, 강화, 터치
 */
function startGame() {
    gameState = 'PLAY';
    document.getElementById('lobby-screen').classList.add('hidden');
    document.getElementById('top-bar').classList.remove('hidden');
    document.getElementById('bottom-bar').classList.remove('hidden');
    gold = 100 + (upgradeGoldLv - 1) * 15;
    wave = 1; life = 30; monsters = []; board = Array(16).fill(null);
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
}

function endGame() {
    gameState = 'OVER';
    const earned = Math.floor(wave * 3); soulStones += earned;
    localStorage.setItem('soulStones', soulStones);
    document.getElementById('over-screen').classList.remove('hidden');
    document.getElementById('result-text').innerText = `최종 WAVE: ${wave}\n영혼석 ${earned}개 획득 완료!`;
}

function updateLobbyUI() {
    document.getElementById('soul-val').innerText = soulStones;
    document.getElementById('atk-lv').innerText = upgradeAtkLv;
    document.getElementById('gold-lv').innerText = upgradeGoldLv;
}

document.getElementById('start-btn').onclick = startGame;
document.getElementById('spawn-btn').onclick = spawnUnit;
document.getElementById('restart-btn').onclick = () => location.reload();
document.getElementById('up-atk-btn').onclick = () => { if(soulStones>=10){ soulStones-=10; upgradeAtkLv++; localStorage.setItem('atkLv', upgradeAtkLv); updateLobbyUI(); } };
document.getElementById('up-gold-btn').onclick = () => { if(soulStones>=15){ soulStones-=15; upgradeGoldLv++; localStorage.setItem('goldLv', upgradeGoldLv); updateLobbyUI(); } };

const getPos = (e) => {
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
};
const down = (e) => {
    const p = getPos(e); mx = p.x; my = p.y;
    for (let i = 0; i < 16; i++) {
        const bx = BOARD_X + (i % 4) * TILE_SIZE, by = BOARD_Y + Math.floor(i / 4) * TILE_SIZE;
        if (mx > bx && mx < bx + TILE_SIZE && my > by && my < by + TILE_SIZE && board[i]) { dragIdx = i; break; }
    }
};
const move = (e) => { const p = getPos(e); mx = p.x; my = p.y; };
const up = () => {
    if (dragIdx !== null) {
        let tidx = -1;
        for (let i = 0; i < 16; i++) {
            const bx = BOARD_X + (i % 4) * TILE_SIZE, by = BOARD_Y + Math.floor(i / 4) * TILE_SIZE;
            if (mx > bx && mx < bx + TILE_SIZE && my > by && my < by + TILE_SIZE) tidx = i;
        }
        if (tidx !== -1 && tidx !== dragIdx) {
            const a = board[dragIdx], b = board[tidx];
            if (b && a.grade === b.grade && a.grade < 3) { board[tidx] = { grade: a.grade+1, timer:0 }; board[dragIdx] = null; }
            else { board[dragIdx] = b; board[tidx] = a; }
        }
        dragIdx = null;
    }
};

canvas.addEventListener('mousedown', down);
canvas.addEventListener('touchstart', (e) => { down(e); e.preventDefault(); }, {passive:false});
window.addEventListener('mousemove', move);
window.addEventListener('touchmove', (e) => { move(e); }, {passive:false});
window.addEventListener('mouseup', up);
window.addEventListener('touchend', up);

// 초기 구동 및 0.1초 뒤 리사이징 (확실한 크기 확보)
window.onload = () => { 
    initLayout(); 
    updateLobbyUI(); 
    setTimeout(initLayout, 100); 
};
window.onresize = initLayout;
</script>
</body>
</html>
