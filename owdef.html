<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>운빨디펜스: 이터널</title>
    <style>
        :root { --p: #00f2ff; --s: #7000ff; --d: #ff0055; --bg: #050505; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; outline: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; font-family: 'Malgun Gothic', sans-serif; }
        
        #game-container {
            position: relative; width: 100vw; height: 100vh;
            background: var(--bg); overflow: hidden; display: flex; flex-direction: column;
        }

        canvas { display: block; width: 100%; height: 100%; touch-action: none; image-rendering: pixelated; }

        /* UI 레이어 - 게임 화면 위 */
        .ui-panel { position: absolute; z-index: 10; pointer-events: none; width: 100%; }
        #top-bar { top: 15px; display: flex; justify-content: space-around; padding: 0 10px; }
        .glass-box { background: rgba(0,0,0,0.75); padding: 8px 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(8px); text-align: center; min-width: 85px; }
        .label { font-size: 10px; color: #888; margin-bottom: 2px; }
        .val { font-size: 16px; font-weight: bold; color: #fff; }

        /* 화면 템플릿 */
        .screen { position: absolute; inset: 0; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; padding: 20px; }
        h1 { color: var(--p); font-size: 42px; margin-bottom: 5px; text-shadow: 0 0 15px var(--p); text-align: center; line-height: 1.1; }
        
        /* 업그레이드 UI */
        .upgrade-list { width: 100%; max-width: 360px; margin-bottom: 30px; }
        .upgrade-item { 
            display: flex; justify-content: space-between; align-items: center; 
            background: #111; padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid #222;
            pointer-events: auto;
        }
        .up-name { font-weight: bold; font-size: 15px; color: #ddd; }
        .up-lv { font-size: 12px; color: var(--p); }
        
        .btn-action { 
            padding: 18px 60px; background: linear-gradient(45deg, var(--s), var(--p));
            border: none; color: white; border-radius: 14px; font-size: 20px; font-weight: bold;
            cursor: pointer; pointer-events: auto; box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }
        .btn-small { padding: 10px 16px; font-size: 13px; background: #333; border-radius: 8px; border: none; color: #fff; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="top-bar" class="ui-panel hidden">
            <div class="glass-box"><div class="label">GOLD</div><div class="val" id="gold-val" style="color:var(--p)">100</div></div>
            <div class="glass-box"><div class="label">LIFE</div><div class="val" id="life-val" style="color:var(--d)">30</div></div>
            <div class="glass-box"><div class="label">WAVE</div><div class="val" id="wave-val">1</div></div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="lobby-screen" class="screen">
            <h1>LUCKY<br>ETERNAL</h1>
            <div style="color:#888; margin-bottom:30px;">보유 영혼석: <span id="soul-val" style="color:var(--p)">0</span></div>
            <div class="upgrade-list">
                <div class="upgrade-item">
                    <div><div class="up-name">공격력 강화</div><div class="up-lv">Lv.<span id="atk-lv">1</span></div></div>
                    <button class="btn-small" onclick="upgradeAtk()">강화 (10개)</button>
                </div>
                <div class="upgrade-item">
                    <div><div class="up-name">초기 골드 강화</div><div class="up-lv">Lv.<span id="gold-lv">1</span></div></div>
                    <button class="btn-small" onclick="upgradeGold()">강화 (15개)</button>
                </div>
            </div>
            <button class="btn-action" onclick="startGame()">전투 시작</button>
        </div>

        <div id="over-screen" class="screen hidden">
            <h1 style="color:var(--d)">DEFEAT</h1>
            <div id="result-text" style="color:#aaa; margin-bottom:30px; text-align: center; line-height: 1.6;"></div>
            <button class="btn-action" onclick="goToLobby()">로비로 이동</button>
        </div>
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('game-container');

const unitImages = { 'A': new Image() };
unitImages['A'].src = 'img/def/tr1.png';

let soulStones = parseInt(localStorage.getItem('soulStones')) || 0;
let upgradeAtkLv = parseInt(localStorage.getItem('atkLv')) || 1;
let upgradeGoldLv = parseInt(localStorage.getItem('goldLv')) || 1;

let gold, wave, life, monsters, board, particles;
let gameState = 'LOBBY', spawnTimer = 0, lastTime = 0, dragIdx = null, mx, my;

const GRADES = [
    { color: 'rgba(255,255,255,0.2)', stroke: '#ffffff', power: 5 },
    { color: 'rgba(0,242,255,0.25)', stroke: '#00f2ff', power: 15 },
    { color: 'rgba(112,0,255,0.3)', stroke: '#7000ff', power: 40 },
    { color: 'rgba(255,0,85,0.35)', stroke: '#ff0055', power: 100 }
];

let TILE_SIZE, BOARD_X, BOARD_Y, PATH, SPAWN_BTN_RECT;

function initLayout() {
    const dpr = Math.min(window.devicePixelRatio, 2);
    const w = container.clientWidth;
    const h = container.clientHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.scale(dpr, dpr);

    TILE_SIZE = Math.min(w / 4.2, 110); 
    BOARD_X = (w - (TILE_SIZE * 4)) / 2;
    BOARD_Y = h * 0.2; 
    
    const offset = 40;
    const pT = BOARD_Y - offset, pB = BOARD_Y + (TILE_SIZE * 4) + offset;
    const pL = BOARD_X - offset, pR = BOARD_X + (TILE_SIZE * 4) + offset;
    PATH = [{x1:pL,y1:pT,x2:pR,y2:pT},{x1:pR,y1:pT,x2:pR,y2:pB},{x1:pR,y1:pB,x2:pL,y2:pB},{x1:pL,y1:pB,x2:pL,y2:pT}];
    
    const btnW = Math.min(w - 80, 320), btnH = 60;
    SPAWN_BTN_RECT = { x: (w - btnW) / 2, y: pB + 25, w: btnW, h: btnH };
}

window.addEventListener('resize', initLayout);
initLayout();
updateLobbyUI();

function updateLobbyUI() {
    document.getElementById('soul-val').innerText = soulStones;
    document.getElementById('atk-lv').innerText = upgradeAtkLv;
    document.getElementById('gold-lv').innerText = upgradeGoldLv;
}

function upgradeAtk() { if (soulStones >= 10) { soulStones -= 10; upgradeAtkLv++; saveData(); updateLobbyUI(); } }
function upgradeGold() { if (soulStones >= 15) { soulStones -= 15; upgradeGoldLv++; saveData(); updateLobbyUI(); } }
function saveData() { localStorage.setItem('soulStones', soulStones); localStorage.setItem('atkLv', upgradeAtkLv); localStorage.setItem('goldLv', upgradeGoldLv); }

function startGame() {
    gameState = 'PLAY';
    document.getElementById('lobby-screen').classList.add('hidden');
    document.getElementById('top-bar').classList.remove('hidden');
    gold = 100 + (upgradeGoldLv - 1) * 10;
    wave = 1; life = 30; monsters = []; board = Array(16).fill(null); particles = [];
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
}

function goToLobby() {
    gameState = 'LOBBY';
    document.getElementById('over-screen').classList.add('hidden');
    document.getElementById('lobby-screen').classList.remove('hidden');
    document.getElementById('top-bar').classList.add('hidden');
    updateLobbyUI();
}

function gameLoop(time) {
    if (gameState !== 'PLAY') return;
    const dt = time - lastTime;
    lastTime = time;

    ctx.fillStyle = '#050505';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 1. 몬스터
    spawnTimer += dt;
    if (spawnTimer > Math.max(400, 2000 - (wave * 100))) {
        monsters.push({ x: PATH[0].x1, y: PATH[0].y1, pathIdx: 0, hp: 25 * Math.pow(1.15, wave), maxHp: 25 * Math.pow(1.15, wave), speed: 1.4 + (wave * 0.05) });
        spawnTimer = 0;
    }

    for (let i = monsters.length - 1; i >= 0; i--) {
        const m = monsters[i];
        const p = PATH[m.pathIdx];
        const dx = p.x2 - p.x1, dy = p.y2 - p.y1;
        const len = Math.sqrt(dx*dx + dy*dy);
        m.x += (dx/len) * m.speed; m.y += (dy/len) * m.speed;
        if (Math.hypot(m.x - p.x2, m.y - p.y2) < 5) {
            m.pathIdx++;
            if (m.pathIdx >= PATH.length) { life--; monsters.splice(i, 1); continue; }
            m.x = PATH[m.pathIdx].x1; m.y = PATH[m.pathIdx].y1;
        }
        ctx.fillStyle = '#ff0055';
        ctx.beginPath(); ctx.arc(m.x, m.y, 11, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#222'; ctx.fillRect(m.x-10, m.y-16, 20, 3);
        ctx.fillStyle = '#0f0'; ctx.fillRect(m.x-10, m.y-16, (m.hp/m.maxHp)*20, 3);
    }

    // 2. 보드 및 유닛
    for (let i = 0; i < 16; i++) {
        const bx = BOARD_X + (i % 4) * TILE_SIZE, by = BOARD_Y + Math.floor(i / 4) * TILE_SIZE;
        ctx.strokeStyle = '#1a1a1a'; ctx.strokeRect(bx+2, by+2, TILE_SIZE-4, TILE_SIZE-4);
        if (board[i] && dragIdx !== i) {
            drawUnit(board[i], bx + TILE_SIZE/2, by + TILE_SIZE/2);
            updateAttack(board[i], bx + TILE_SIZE/2, by + TILE_SIZE/2, dt);
        }
    }
    if (dragIdx !== null) drawUnit(board[dragIdx], mx, my, true);

    // 3. 소환 버튼 (UI 복구)
    const r = SPAWN_BTN_RECT;
    ctx.fillStyle = gold >= 10 ? '#7000ff' : '#222';
    ctx.beginPath(); ctx.roundRect(r.x, r.y, r.w, r.h, 12); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(`유닛 소환 (10G)`, r.x + r.w/2, r.y + r.h/2 + 6);

    updateParticles();
    document.getElementById('gold-val').innerText = Math.floor(gold);
    document.getElementById('life-val').innerText = life;
    document.getElementById('wave-val').innerText = wave;

    if (life <= 0) endGame(); else requestAnimationFrame(gameLoop);
}

/** 🛠️ 유닛 그리기 (타원형 납작 오라 적용) **/
function drawUnit(u, x, y, isDrag = false) {
    const g = GRADES[u.grade];
    const size = TILE_SIZE * 0.8;

    // --- 타원형 얇은 오라 ---
    ctx.fillStyle = g.color;
    ctx.beginPath();
    // 가로 size/1.8, 세로 size/5 로 매우 납작한 타원
    ctx.ellipse(x, y + size/2.5, size/1.8, size/5, 0, 0, Math.PI * 2);
    ctx.fill();

    const img = unitImages[u.name];
    if (img && img.complete && img.naturalWidth !== 0) {
        ctx.drawImage(img, x - size/2, y - size/2, size, size);
    } else {
        ctx.fillStyle = g.stroke;
        ctx.beginPath(); ctx.arc(x, y, size/3.2, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#000'; ctx.font = 'bold 14px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(u.name, x, y+5);
    }
    
    if (isDrag) {
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
        ctx.strokeRect(x - TILE_SIZE/2, y - TILE_SIZE/2, TILE_SIZE, TILE_SIZE);
    }
}

function updateAttack(u, ux, uy, dt) {
    u.timer = (u.timer || 0) + dt;
    if (u.timer > (1000 - u.grade*150) && monsters.length > 0) {
        const bonus = 1 + (upgradeAtkLv - 1) * 0.05;
        let target = monsters.find(m => Math.hypot(m.x - ux, m.y - uy) < 180);
        if (target) {
            u.timer = 0;
            ctx.strokeStyle = GRADES[u.grade].stroke; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(ux, uy); ctx.lineTo(target.x, target.y); ctx.stroke();
            target.hp -= GRADES[u.grade].power * bonus;
            if (target.hp <= 0) {
                gold += 2; createExplosion(target.x, target.y, GRADES[u.grade].stroke);
                monsters.splice(monsters.indexOf(target), 1);
            }
        }
    }
}

function handleStart(e) {
    const rect = canvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    mx = cx - rect.left; my = cy - rect.top;
    
    const r = SPAWN_BTN_RECT;
    if (mx > r.x && mx < r.x + r.w && my > r.y && my < r.y + r.h) { spawnUnit(); return; }
    
    for (let i = 0; i < 16; i++) {
        const bx = BOARD_X + (i % 4) * TILE_SIZE, by = BOARD_Y + Math.floor(i / 4) * TILE_SIZE;
        if (mx > bx && mx < bx + TILE_SIZE && my > by && my < by + TILE_SIZE) if (board[i]) dragIdx = i;
    }
}

function spawnUnit() {
    const empty = board.map((v, i) => v === null ? i : null).filter(v => v !== null);
    if (empty.length > 0 && gold >= 10) {
        gold -= 10;
        const idx = empty[Math.floor(Math.random() * empty.length)];
        const names = ['K', 'A', 'M', 'R'];
        board[idx] = { name: names[Math.floor(Math.random()*4)], grade: 0, timer: 0 };
    }
}

function handleEnd() {
    if (dragIdx === null) return;
    let targetIdx = -1;
    for (let i = 0; i < 16; i++) {
        const bx = BOARD_X + (i % 4) * TILE_SIZE, by = BOARD_Y + Math.floor(i / 4) * TILE_SIZE;
        if (mx > bx && mx < bx + TILE_SIZE && my > by && my < by + TILE_SIZE) targetIdx = i;
    }
    if (targetIdx !== -1 && targetIdx !== dragIdx) {
        const a = board[dragIdx], b = board[targetIdx];
        if (b && a.name === b.name && a.grade === b.grade && a.grade < 3) {
            board[targetIdx] = { ...a, grade: a.grade + 1, timer: 0 };
            board[dragIdx] = null;
            createExplosion(mx, my, GRADES[a.grade+1].stroke);
        } else { board[dragIdx] = b; board[targetIdx] = a; }
    }
    dragIdx = null;
}

function endGame() {
    gameState = 'OVER';
    const earned = Math.floor(wave * 1.5); soulStones += earned; saveData();
    document.getElementById('over-screen').classList.remove('hidden');
    document.getElementById('result-text').innerText = `최종 웨이브: ${wave}\n획득 영혼석: +${earned}`;
}

function createExplosion(x,y,c){for(let i=0;i<8;i++)particles.push({x,y,c,vx:(Math.random()-0.5)*10,vy:(Math.random()-0.5)*10,life:1})}
function updateParticles(){particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=0.05;ctx.fillStyle=p.c;ctx.globalAlpha=p.life;ctx.fillRect(p.x,p.y,3,3)});particles=particles.filter(p=>p.life>0);ctx.globalAlpha=1}

canvas.addEventListener('mousedown', handleStart);
window.addEventListener('mousemove', (e)=>{ const rect = canvas.getBoundingClientRect(); mx = e.clientX - rect.left; my = e.clientY - rect.top; });
window.addEventListener('mouseup', handleEnd);
canvas.addEventListener('touchstart', (e)=>{e.preventDefault(); handleStart(e)}, {passive:false});
window.addEventListener('touchmove', (e)=>{
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    mx = e.touches[0].clientX - rect.left; my = e.touches[0].clientY - rect.top;
}, {passive:false});
window.addEventListener('touchend', handleEnd);
</script>
</body>
</html>
